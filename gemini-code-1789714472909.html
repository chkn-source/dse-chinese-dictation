      font-weight: bold;

      padding: 15px;
      border-radius: 8px;
      border: 2px dashed #cbd5e1;

      cursor: pointer;

      text-align: center;

  // 自動依據標點符號（，。！？；）進行精細斷句的函式
  function splitTextByPunctuation(text) {
    let result = [];
    let current = "";
    const puncs = ["，", "。", "！", "？", "；", "："];

    for (let char of text) {
      current += char;
      if (puncs.includes(char)) {
        if (current.trim()) result.push(current);
        current = "";
      }
    }
    if (current.trim()) result.push(current);
    return result;
  }

  let state = { articleId: null, paragraphIndex: 0, mode: null };

  window.onload = () => renderArticleGrid();

  function showPage(pageId) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.getElementById('result-msg').innerText = '';
  }

  function renderArticleGrid() {
    const grid = document.getElementById('article-grid');
    grid.innerHTML = '';
    Object.keys(database).forEach(key => {
      const btn = document.createElement('div');
      btn.className = 'card-btn';
      btn.innerText = database[key].title;
      btn.onclick = () => selectArticle(key);
      grid.appendChild(btn);
    });
  }

  function selectArticle(id) {
    state.articleId = id;
    const article = database[id];
    document.getElementById('selected-title').innerText = article.title;

    const pGrid = document.getElementById('paragraph-grid');
    pGrid.innerHTML = '';

    const allBtn = document.createElement('div');
    allBtn.className = 'card-btn';
    allBtn.innerText = '📖 全篇綜合連貫溫習';
    allBtn.onclick = () => { state.paragraphIndex = 'all'; highlightParagraphBtn(allBtn); };
    pGrid.appendChild(allBtn);

    article.paragraphs.forEach((p, idx) => {
      const btn = document.createElement('div');
      btn.className = 'card-btn';
      btn.innerText = p.name;
      btn.onclick = () => { state.paragraphIndex = idx; highlightParagraphBtn(btn); };
      pGrid.appendChild(btn);
    });

    allBtn.click();
    showPage('page-config');
  }

  function highlightParagraphBtn(activeBtn) {
    document.querySelectorAll('#paragraph-grid .card-btn').forEach(b => b.style.borderColor = '#e2e8f0');
    activeBtn.style.borderColor = '#2563eb';
  }

  function selectMode(mode) {
    state.mode = mode;
    showPage('page-game');
    initGame();
  }

  function initGame() {
    const article = database[state.articleId];
    const container = document.getElementById('game-container');
    container.innerHTML = '';

    let targets = (state.paragraphIndex === 'all') 
      ? article.paragraphs 
      : [article.paragraphs[state.paragraphIndex]];

    if (state.mode === 'arrange') {
      document.getElementById('game-title').innerText = "🧩 逐句句讀重組關卡";
      document.getElementById('game-desc').innerText = "點擊卡牌按文言語意與句讀順序將其移至上方組合區：";

      targets.forEach(p => {
        let pLabel = document.createElement('h4');
        pLabel.innerText = p.name;
        pLabel.style.marginTop = "20px";

        // 按行（條/句）進行分類，每行獨立成為一個遊戲重組區
        let lines = p.rawText.split('\n');

        lines.forEach((lineText, lIdx) => {
          if(!lineText.trim()) return;

          let subLabel = document.createElement('div');
          subLabel.style.fontWeight = "bold";
          subLabel.style.color = "#475569";
          subLabel.style.marginTop = "15px";
          subLabel.innerText = `第 ${lIdx + 1} 組文句：`;

          let dropZone = document.createElement('div');
          dropZone.className = 'drop-zone';
          
          let wordPool = document.createElement('div');
          wordPool.className = 'word-pool';

          // 核心：直接按每一個標點符號進行精細斷句！
          let quoteArr = splitTextByPunctuation(lineText);
          let shuffled = [...quoteArr].sort(() => Math.random() - 0.5);

          shuffled.forEach(chunkText => {
            let chip = document.createElement('div');
            chip.className = 'chip-item';
            chip.innerText = chunkText;
            
            chip.onclick = () => {
              if (chip.parentElement === wordPool) dropZone.appendChild(chip);
              else wordPool.appendChild(chip);
            };
            wordPool.appendChild(chip);
          });

          container.appendChild(subLabel);
          container.appendChild(dropZone);
          container.appendChild(wordPool);
        });
      });

    } else if (state.mode === 'fill') {
      document.getElementById('game-title').innerText = "✏️ 官方原文挖空默寫關卡";
      document.getElementById('game-desc').innerText = "閱讀完整的官方正本原文，在底線上精確填寫考核關鍵字：";

      targets.forEach(p => {
        let pDiv = document.createElement('div');
        pDiv.className = 'text-display-box';
        pDiv.style.whiteSpace = "pre-line";

        let title = document.createElement('h4');
        title.innerText = p.name;
        container.appendChild(title);

        p.blanks.forEach(b => {
          pDiv.appendChild(document.createTextNode(b.text));
          if (b.ans !== "") {
            let input = document.createElement('input');
            input.className = 'blank-input';
            input.dataset.ans = b.ans;
            pDiv.appendChild(input);
          }
        });
        container.appendChild(pDiv);
      });

    } else if (state.mode === 'recite') {
      document.getElementById('game-title').innerText = "🔥 完整全文默寫關卡";
      document.getElementById('game-desc').innerText = "精確默寫出對應單元的完整原文（包含正確標點）：";

      targets.forEach(p => {
        let label = document.createElement('h4');
        label.innerText = p.name;
        let textarea = document.createElement('textarea');
        textarea.style.width = "100%";
        textarea.style.height = "140px";
        textarea.style.fontSize = "1.1rem";
        textarea.style.padding = "12px";
        textarea.style.borderRadius = "8px";
        textarea.style.border = "1px solid #cbd5e1";
        textarea.style.lineHeight = "1.6";
        textarea.dataset.ans = p.rawText;
        
        container.appendChild(label);
        container.appendChild(textarea);
      });
    }
  }

  function checkAnswer() {
    const msg = document.getElementById('result-msg');
    let isCorrect = true;

    if (state.mode === 'arrange') {
      const dropZones = document.querySelectorAll('.drop-zone');
      let article = database[state.articleId];
      let targets = (state.paragraphIndex === 'all') ? article.paragraphs : [article.paragraphs[state.paragraphIndex]];

      let currentZoneIdx = 0;
      targets.forEach(p => {
        let lines = p.rawText.split('\n');
        lines.forEach(lineText => {
          if(!lineText.trim()) return;
          let zone = dropZones[currentZoneIdx];
          let userResult = Array.from(zone.children).map(c => c.innerText).join('');
          let targetResult = splitTextByPunctuation(lineText).join('');
          
          if (userResult !== targetResult) isCorrect = false;
          currentZoneIdx++;
        });
      });

    } else if (state.mode === 'fill') {
      const inputs = document.querySelectorAll('.blank-input');
      inputs.forEach(input => {
        if (input.value.trim() !== input.dataset.ans) {
          input.style.borderBottomColor = "#ef4444";
          isCorrect = false;
        } else {
          input.style.borderBottomColor = "#10b981";
        }
      });

    } else if (state.mode === 'recite') {
      const textareas = document.querySelectorAll('textarea');
      textareas.forEach(ta => {
        let cleanUser = ta.value.replace(/[^\u4e00-\u9fa5]/g, "");
        let cleanAns = ta.dataset.ans.replace(/[^\u4e00-\u9fa5]/g, "");
        if (cleanUser !== cleanAns) isCorrect = false;
      });
    }

    if (isCorrect) {
      msg.innerText = "🎉 太棒了！句讀順序與語意完全正確！";
      msg.style.color = "#10b981";
    } else {
      msg.innerText = "❌ 排列順序有誤，請再對照語意與句讀檢查！";
      msg.style.color = "#ef4444";
    }
  }
</script>
